<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploration Prototype</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="layout">
    <section>
      <div class="game-viewport">
        <canvas id="game" width="960" height="640" aria-label="Game canvas"></canvas>
        <div id="dialogue" class="dialogue" role="dialog" aria-live="polite" hidden>
          <div class="dialogue-speaker" data-dialogue-speaker hidden></div>
          <div class="dialogue-text" data-dialogue-text></div>
          <div class="dialogue-prompt" data-dialogue-prompt></div>
        </div>
      </div>
    </section>

    <aside>
      <h1>Exploration Prototype</h1>
      <p>Move: Arrow keys or WASD</p>
      <p>Interact / advance text: Z or Enter</p>
      <p id="status">Loading…</p>
      <pre id="event-log" aria-live="polite"></pre>
    </aside>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
