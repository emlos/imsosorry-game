<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploration Prototype</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="layout">
    <section>
      <canvas id="game" width="960" height="640" aria-label="Game canvas"></canvas>
    </section>

    <aside>
      <h1>Exploration Prototype</h1>
      <p>Move: Arrow keys or WASD</p>
      <p>Interact: Z or Enter</p>
      <p id="status">Loading…</p>
      <pre id="event-log" aria-live="polite"></pre>
    </aside>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
